# =============================================================================
#  Lumina — Pipeline CI/CD GitLab
#  - Build APK release SIGNÉ (google-services.json + keystore + .env injectés
#    depuis les CI/CD Variables, jamais commités)
#  - Release GitLab native avec l'APK téléchargeable (via Package Registry)
#
#  Structure du dépôt : le projet Flutter est dans le sous-dossier `lumina/`.
#  Runner : GitLab.com (shared Docker runners).
# =============================================================================

variables:
  # >>> À VÉRIFIER <<<
  # Votre projet tournait sur le canal beta 3.45.0-0.1.pre. Choisissez le tag
  # d'image le plus proche. Liste des tags disponibles :
  #   https://hub.docker.com/r/cirruslabs/flutter/tags
  FLUTTER_IMAGE: "ghcr.io/cirruslabs/flutter:beta"

  # Builds reproductibles + emplacements de cache stables
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  PUB_CACHE: "$CI_PROJECT_DIR/.pub-cache"
  GRADLE_USER_HOME: "$CI_PROJECT_DIR/.gradle"

# Cache partagé (dépendances pub + Gradle) — accélère fortement les builds
cache:
  key:
    files:
      - lumina/pubspec.lock
      - lumina/android/app/build.gradle
  paths:
    - .pub-cache/
    - .gradle/
  policy: pull-push

stages:
  - analyze
  - build
  - upload
  - release

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH
    - if: $CI_COMMIT_TAG

# -----------------------------------------------------------------------------
# Template caché : injection des fichiers sensibles AVANT le build.
# Toutes les valeurs proviennent des CI/CD Variables (Settings › CI/CD › Variables).
# Rien n'est écrit en clair dans ce fichier.
# -----------------------------------------------------------------------------
.setup-secrets:
  before_script:
    - cd lumina
    # 1) .env — variables individuelles (Masked + Protected) -> fichier .env
    - |
      {
        printf 'SUPABASE_URL=%s\n'        "$SUPABASE_URL"
        printf 'SUPABASE_ANON_KEY=%s\n'   "$SUPABASE_ANON_KEY"
        printf 'SENTRY_DSN=%s\n'          "$SENTRY_DSN"
        printf 'ENVIRONMENT=%s\n'         "$ENVIRONMENT"
        printf 'GOOGLE_WEB_CLIENT_ID=%s\n' "$GOOGLE_WEB_CLIENT_ID"
      } > .env
    # 2) google-services.json — REQUIS AU BUILD par le plugin Gradle
    #    com.google.gms.google-services (sinon : "File google-services.json is missing").
    #    Contenu : config Google Sign-In (OAuth, utilisé par Supabase Auth via le
    #    provider Google) ET Firebase Cloud Messaging (notifications push).
    #    NB : le backend est Supabase, mais google-services.json reste nécessaire
    #    pour Google Sign-In + FCM. Variable de TYPE FILE (JSON brut, PAS de base64).
    - cp "$GOOGLE_SERVICES_JSON" android/app/google-services.json
    # 3) keystore .jks (BINAIRE) — variable base64 -> décodage (le base64 reste "Maskable")
    - printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks
    # 4) signing.properties lu par android/app/build.gradle (clés préfixées fev*)
    - |
      {
        echo "fevStoreFile=upload-keystore.jks"
        echo "fevStorePassword=$KEYSTORE_PASSWORD"
        echo "fevKeyAlias=$KEY_ALIAS"
        echo "fevKeyPassword=$KEY_PASSWORD"
      } > android/app/signing.properties
  # Nettoyage des secrets du workspace quoi qu'il arrive (succès OU échec)
  after_script:
    - rm -f lumina/.env lumina/android/app/google-services.json lumina/android/app/upload-keystore.jks lumina/android/app/signing.properties

# =============================================================================
# 1) ANALYZE — qualité du code (main + merge requests)
# =============================================================================
analyze:
  stage: analyze
  image:
    name: $FLUTTER_IMAGE
    entrypoint: [""]
  extends: .setup-secrets
  interruptible: true
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  script:
    - dart run build_runner build --delete-conflicting-outputs
    - flutter analyze

# =============================================================================
# 2) BUILD — APK release signé (sur main pour vérifier + sur tag pour la release)
# =============================================================================
build:apk:
  stage: build
  image:
    name: $FLUTTER_IMAGE
    entrypoint: [""]
  extends: .setup-secrets
  interruptible: true
  rules:
    - if: $CI_COMMIT_TAG                       # release
    - if: $CI_COMMIT_BRANCH == "main"          # vérification continue
  script:
    - dart run build_runner build --delete-conflicting-outputs
    - flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
    # Nomme l'APK avec le tag (v1.0.0) ou le short SHA (sur main)
    - APK_NAME="Lumina-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}.apk"
    - mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
    - echo "APK_NAME=$APK_NAME" >> apk_name.env
  artifacts:
    name: "lumina-apk-${CI_COMMIT_TAG:-$CI_COMMIT_SHORT_SHA}"
    paths:
      - lumina/build/app/outputs/flutter-apk/Lumina-*.apk
      - lumina/build/app/outputs/symbols/        # symboles de debug (désobfuscation Sentry)
    expire_in: 30 days
    reports:
      dotenv: apk_name.env

# =============================================================================
# 3) Prépare la version (extrait "1.0.0" depuis le tag "v1.0.0")
#    Le Package Registry exige une version au format X.Y.Z (chiffres + points).
# =============================================================================
prepare:version:
  stage: build
  image: alpine:latest
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - PKG_VER="${CI_COMMIT_TAG#v}"   # retire le "v" initial
    - |
      {
        echo "PACKAGE_VERSION=$PKG_VER"
        echo "PACKAGE_REGISTRY_URL=${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/lumina/$PKG_VER"
      } > version.env
    - cat version.env
  artifacts:
    reports:
      dotenv: version.env

# =============================================================================
# 4) UPLOAD — pousse l'APK dans le Package Registry (stockage PERMANENT)
#    On ne lie JAMAIS un artifact de job à une release (ils expirent).
# =============================================================================
upload:package:
  stage: upload
  image: curlimages/curl:latest
  needs:
    - job: build:apk
      artifacts: true
    - job: prepare:version
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - |
      curl --header "JOB-TOKEN: $CI_JOB_TOKEN" --fail \
        --upload-file "lumina/build/app/outputs/flutter-apk/$APK_NAME" \
        "$PACKAGE_REGISTRY_URL/$APK_NAME"
      echo "APK publié dans le Package Registry : $PACKAGE_REGISTRY_URL/$APK_NAME"

# =============================================================================
# 5) RELEASE — crée la release GitLab (mot-clé natif) + lien vers l'APK
# =============================================================================
release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  needs:
    - job: upload:package
    - job: build:apk
      artifacts: true
    - job: prepare:version
      artifacts: true
  rules:
    - if: $CI_COMMIT_TAG
  script:
    - echo "Création de la release $CI_COMMIT_TAG"
  release:
    name: "Lumina $CI_COMMIT_TAG"
    tag_name: "$CI_COMMIT_TAG"
    description: "Release Lumina $CI_COMMIT_TAG — APK de production signé et obfusqué."
    assets:
      links:
        - name: "$APK_NAME"
          url: "$PACKAGE_REGISTRY_URL/$APK_NAME"
          link_type: package
