# build.yaml - Configuration optimisée pour build_runner
targets:
  $default:
    builders:
      # Riverpod generator optimisé
      riverpod_generator:
        options:
          # Génération plus rapide
          line_length: 80
        generate_for:
          - lib/**/*.dart
          - test/**/*.dart
        
      # Freezed optimisé
      freezed:
        generate_for:
          - lib/**/entities/*.dart
          - lib/**/models/*.dart
          - lib/**/providers/*.dart
        
      # JSON serializable optimisé
      json_serializable:
        options:
          explicit_to_json: true
          field_rename: snake
        generate_for:
          - lib/**/models/*.dart
          - lib/**/entities/*.dart
