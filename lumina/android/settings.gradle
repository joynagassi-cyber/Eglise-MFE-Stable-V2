pluginManagement {
    def flutterProperties = new Properties()
    def flutterPropertiesFile = new File(settingsDir, "local.properties")
    if (flutterPropertiesFile.exists()) {
        flutterPropertiesFile.withInputStream { flutterProperties.load(it) }
    }

    def flutterSdkPath = flutterProperties.getProperty("flutter.sdk")
    if (flutterSdkPath == null) {
        throw new RuntimeException("flutter.sdk not set in local.properties")
    }

    def normalizedSdkPath = flutterSdkPath.replace('\\', '/')
    includeBuild "${normalizedSdkPath}/packages/flutter_tools/gradle"

    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id "dev.flutter.flutter-plugin-loader" version "1.0.0"
    id "com.android.application" version '8.7.3' apply false
    id "com.android.library" version '8.7.3' apply false
    id "org.jetbrains.kotlin.android" version "2.1.0" apply false
    id "com.google.gms.google-services" version "4.4.2" apply false
}

include ":app"
