plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
    id "com.google.gms.google-services"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = file('signing.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.lumina.mfejc"
    compileSdk = 36
    ndkVersion = "28.2.13676358"

    signingConfigs {
        release {
            keyAlias = keystoreProperties['KEY_ALIAS']
            keyPassword = keystoreProperties['KEY_PASSWORD']
            storePassword = keystoreProperties['KEYSTORE_PASSWORD']

            def kFile = keystoreProperties['KEYSTORE_FILE'] ?: 'upload-keystore.jks'
            // Ensure we use a clean path relative to the app directory
            storeFile = file(kFile)
        }
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    defaultConfig {
        applicationId = "com.lumina.mfejc"
        // ⚠️ minSdk 24 required for google_sign_in_android
        minSdkVersion = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
        multiDexEnabled true  // Required if +65k methods
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            
            shrinkResources true
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}
