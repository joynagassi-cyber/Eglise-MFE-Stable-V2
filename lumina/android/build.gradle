// Root build.gradle for Flutter Android project
// AGP resolved in settings.gradle; Kotlin 2.1.0
// google-services declared in settings.gradle plugins block

allprojects {
    repositories {
        google()
        mavenCentral()
    }
    configurations.all {
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
        resolutionStrategy.cacheChangingModulesFor 0, 'seconds'
    }
}

// CRITICAL: Redirect build output from android/build/ to ../build/ (Flutter project root).
// Without this, Flutter's "flutter build apk" cannot find the generated APK.
rootProject.buildDir = '../build'

subprojects {
    // Align each subproject's build directory under the root buildDir
    project.layout.buildDirectory = file("${rootProject.buildDir}/${project.name}")

    // 1. Force SDK versions for all plugins/subprojects to fix lStar error
    afterEvaluate { project ->
        if (project.hasProperty('android')) {
            project.android {
                if (namespace == null) {
                    try {
                        namespace project.group
                    } catch (Exception e) {
                        // ignore
                    }
                }
                // Use Math.max to avoid downgrading plugins that need higher
                // but ensuring at least 35 for the lStar fix
                compileSdk Math.max(project.android.compileSdk ?: 0, 36)
                buildToolsVersion "36.0.0"
                defaultConfig {
                    minSdk 24
                    targetSdk Math.max(project.android.defaultConfig.targetSdk ?: 0, 36)
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                // Force CMake 3.31.5 for all subprojects (fixes CMake 3.22.1 parsing bug with NDK 28 on Windows)
                externalNativeBuild.cmake.version = "3.31.5"
            }
            // Fix: Synchronize Kotlin JVM target with Java 17 to avoid "Inconsistent JVM-target"
            project.tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
        }
    }

    // 2. Control dependencies version across all subprojects
    project.configurations.all {
        resolutionStrategy {
            eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion "2.1.0"
                }
                if (details.requested.group == 'androidx.core') {
                    def module = details.requested.name
                    if (module == 'core' || module == 'core-ktx' || module == 'core-testing') {
                        details.useVersion "1.13.1"
                    } else if (module == 'core-backported-fixes') {
                        details.useVersion "1.0.0"
                    }
                }
                if (details.requested.group == 'androidx.activity') {
                    details.useVersion "1.9.0"
                }
                if (details.requested.group == 'androidx.browser') {
                    details.useVersion "1.8.0"
                }
            }
        }
    }
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
