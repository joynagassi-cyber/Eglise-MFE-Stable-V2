org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.parallel=true
org.gradle.caching=true
# org.gradle.configuration-cache=true  — incompatible avec le plugin Flutter Gradle
android.useAndroidX=true
kotlin.suppressWarnings=true
org.gradle.warning.mode=none
android.javaCompile.suppressSourceTargetDeprecationWarning=true
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=300000
org.gradle.daemon=true