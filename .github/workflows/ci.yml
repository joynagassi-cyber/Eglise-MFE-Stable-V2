# =============================================================================
#  Lumina — CI (analyse + build APK release)
#  Déclencheur : push sur main + pull requests
#  Projet Flutter dans le sous-dossier lumina/
# =============================================================================

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: lumina

env:
  FLUTTER_CHANNEL: beta
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: "17"
  APP_PACKAGE: "com.lumina.mfejc"
  VERSION: ""

jobs:
  # ---------------------------------------------------------------------------
  # 1) ANALYZE
  # ---------------------------------------------------------------------------
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env placeholder for analysis
        run: touch .env

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      #- name: Run unit tests
      #  run: flutter test --reporter=expanded

  # ---------------------------------------------------------------------------
  # 2) BUILD APK
  # ---------------------------------------------------------------------------
  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: analyze

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Create .env placeholder for build
        run: touch .env

      # --- Injection des secrets ---

      # --- Injection des secrets via --dart-define (pas de .env sur le disque) ---

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Validate google-services.json package name
        run: |
          python3 -c "
          import json, sys
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          pkgs = [c['client_info']['android_client_info']['package_name'] for c in data.get('client', [])]
          if '$APP_PACKAGE' in pkgs:
              print(f'OK: $APP_PACKAGE found in {pkgs}')
          else:
              print(f'MISMATCH: $APP_PACKAGE not found. Found: {pkgs}')
              sys.exit(1)
          "

      - name: Inject keystore
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: |
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Verify keystore integrity
        run: |
          echo "Keystore file size: $(wc -c < android/app/upload-keystore.jks) bytes"
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" 2>&1 || {
              echo "::error::Keystore verification failed — check UPLOAD_KEYSTORE_B64, KEYSTORE_PASSWORD and KEY_ALIAS"
              exit 1
            }

      - name: Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "KEYSTORE_FILE=upload-keystore.jks"        > android/app/signing.properties
          echo "KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD"     >> android/app/signing.properties
          echo "KEY_ALIAS=$KEYSTORE_ALIAS"                >> android/app/signing.properties
          echo "KEY_PASSWORD=$KEY_PASSWORD"               >> android/app/signing.properties
          echo "signing.properties keys:"
          grep -E '^[A-Za-z_]' android/app/signing.properties | sed 's/=.*/=<redacted>/'

      # --- Build ---

      - name: Read app version from pubspec.yaml
        id: app_version
        run: |
          VERSION=$(grep "^version:" pubspec.yaml | sed 's/version: //' | sed 's/+.*//')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Detected app version: $VERSION"

      - name: Build APK (release) with secrets injected
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -o pipefail
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            2>&1 | tee build.log

      - name: Diagnose — locate APK files
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find build -name "*.apk" 2>/dev/null || echo "No APK files found under build/"
          echo ""
          echo "=== Build output structure ==="
          find build/app/outputs -type f 2>/dev/null | head -30 || echo "No outputs directory"

      - name: Show Gradle error on failure
        if: failure()
        run: |
          echo "=== GRADLE ERROR DETAILS ==="
          grep -B2 -A10 "FAILURE\|What went wrong\|Execution failed\|signing\|Keytool\|keystore\|tampered\|Incorrect\|BUILD FAILED" build.log || echo "No matching error pattern found"
          echo ""
          echo "=== SIGNING CONFIG ==="
          cat android/app/signing.properties 2>/dev/null | sed 's/=.*/=***/' || echo "signing.properties not found"
          echo ""
          echo "=== KEYSTORE FILE ==="
          ls -la android/app/upload-keystore.jks 2>/dev/null || echo "keystore not found"
          echo ""
          echo "=== BUILD DIRECTORY TREE ==="
          find build -name "*.apk" -o -name "output-metadata.json" 2>/dev/null || echo "No build output found"

      # --- Upload ---

      - name: Upload APK to release
        if: success() && github.ref == 'refs/heads/main'
        uses: softprops/action-upload-release-assets@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          file_path: lumina/build/app/outputs/apk/release/app-release.apk
          asset_name: Lumina-v${{ env.VERSION || '1.0.5' }}.apk
          tag_name: v${{ env.VERSION || '1.0.5' }}

      - name: Upload APK artifact (CI artifact, zipped)
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumina-APK-${{ github.sha }}
          path: |
            lumina/build/app/outputs/flutter-apk/app-release.apk
            lumina/build/app/outputs/apk/release/app-release.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Lumina-symbols-${{ github.sha }}
          path: lumina/build/app/outputs/symbols/
          retention-days: 30
          if-no-files-found: warn

      # --- Nettoyage ---

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f android/app/upload-keystore.jks
          rm -f android/app/signing.properties


# trigger ci release asset

