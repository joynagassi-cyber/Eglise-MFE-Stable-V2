# =============================================================================
#  Lumina — Release (APK signé + GitHub Release)
#  Déclencheur : push d'un tag v* (ex: v1.0.0)
#  Projet Flutter dans le sous-dossier lumina/
# =============================================================================

name: Release

on:
  push:
    tags:
      - "v*"

defaults:
  run:
    working-directory: lumina

env:
  FLUTTER_CHANNEL: beta
  JAVA_DISTRIBUTION: temurin
  JAVA_VERSION: "17"
  APP_PACKAGE: "com.lumina.mfejc"

permissions:
  contents: write

jobs:
  # ---------------------------------------------------------------------------
  # 1) BUILD — APK release signé + obfusqué
  # ---------------------------------------------------------------------------
  build:
    name: Build signed APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ env.FLUTTER_CHANNEL }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # --- Injection des secrets via --dart-define (pas de .env sur le disque) ---

      - name: Inject google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          printf '%s' "$GOOGLE_SERVICES_JSON_B64" | base64 -d > android/app/google-services.json

      - name: Validate google-services.json package name
        run: |
          PKG_NAME=$(python3 -c "
          import json, sys
          with open('android/app/google-services.json') as f:
              data = json.load(f)
          pkgs = [c['client_info']['android_client_info']['package_name'] for c in data.get('client', [])]
          if '$APP_PACKAGE' in pkgs:
              print('ok')
          else:
              print(f'MISMATCH: $APP_PACKAGE not found in google-services.json. Found: {pkgs}')
              sys.exit(1)
          ")
          echo "Package validation: $PKG_NAME"

      - name: Inject keystore
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.UPLOAD_KEYSTORE_B64 }}
        run: printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 -d > android/app/upload-keystore.jks

      - name: Verify keystore integrity
        run: |
          echo "Keystore file size: $(wc -c < android/app/upload-keystore.jks) bytes"
          keytool -list -keystore android/app/upload-keystore.jks \
            -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
            -alias "${{ secrets.KEY_ALIAS }}" 2>&1 || {
              echo "::error::Keystore verification failed"
              exit 1
            }

      - name: Create signing.properties
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "storeFile=upload-keystore.jks"      > android/app/signing.properties
          echo "storePassword=$KEYSTORE_PASSWORD"   >> android/app/signing.properties
          echo "keyAlias=$KEY_ALIAS"                >> android/app/signing.properties
          echo "keyPassword=$KEY_PASSWORD"          >> android/app/signing.properties

      # --- Build ---

      - name: Generate code (build_runner)
        run: dart run build_runner build --delete-conflicting-outputs

      - name: Build signed APK with secrets injected
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          ENVIRONMENT: ${{ secrets.ENVIRONMENT }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
        run: |
          set -o pipefail
          flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols \
            --dart-define=SUPABASE_URL="$SUPABASE_URL" \
            --dart-define=SUPABASE_ANON_KEY="$SUPABASE_ANON_KEY" \
            --dart-define=SENTRY_DSN="$SENTRY_DSN" \
            --dart-define=ENVIRONMENT="$ENVIRONMENT" \
            --dart-define=GOOGLE_WEB_CLIENT_ID="$GOOGLE_WEB_CLIENT_ID" \
            2>&1 | tee build.log

      - name: Diagnose — locate APK files
        if: always()
        run: |
          echo "=== Searching for APK files ==="
          find build -name "*.apk" 2>/dev/null || echo "No APK files found under build/"

      - name: Show Gradle error on failure
        if: failure()
        run: |
          echo "=== GRADLE ERROR DETAILS ==="
          grep -B2 -A10 "FAILURE\|What went wrong\|Execution failed\|signing\|Keytool\|keystore\|tampered\|Incorrect\|BUILD FAILED" build.log || echo "No matching error pattern found"
          echo ""
          echo "=== BUILD DIRECTORY TREE ==="
          find build -name "*.apk" -o -name "output-metadata.json" 2>/dev/null || echo "No build output found"

      # --- Rename APK avec le tag ---

      - name: Rename APK
        id: apk
        run: |
          TAG="${GITHUB_REF_NAME}"
          APK_NAME="Lumina-${TAG}.apk"
          # Try both possible output paths (flutter-apk/ and apk/release/)
          if [ -f build/app/outputs/flutter-apk/app-release.apk ]; then
            mv build/app/outputs/flutter-apk/app-release.apk "build/app/outputs/flutter-apk/$APK_NAME"
            echo "apk_path=build/app/outputs/flutter-apk/$APK_NAME" >> "$GITHUB_OUTPUT"
          elif [ -f build/app/outputs/apk/release/app-release.apk ]; then
            mv build/app/outputs/apk/release/app-release.apk "build/app/outputs/apk/release/$APK_NAME"
            echo "apk_path=build/app/outputs/apk/release/$APK_NAME" >> "$GITHUB_OUTPUT"
          else
            echo "::error::APK not found in any expected location"
            find build -name "*.apk" 2>/dev/null
            exit 1
          fi
          echo "apk_name=$APK_NAME" >> "$GITHUB_OUTPUT"

      # --- Upload artifacts pour le job release ---

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: lumina/${{ steps.apk.outputs.apk_path }}
          retention-days: 1

      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: release-symbols
          path: lumina/build/app/outputs/symbols/
          retention-days: 90

      - name: Cleanup secrets
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f android/app/upload-keystore.jks
          rm -f android/app/signing.properties

  # ---------------------------------------------------------------------------
  # 2) RELEASE — crée la GitHub Release + upload l'APK
  # ---------------------------------------------------------------------------
  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 5

    steps:
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: ./artifacts/

      - name: Download symbols
        uses: actions/download-artifact@v4
        with:
          name: release-symbols
          path: ./symbols/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: "Lumina ${{ github.ref_name }}"
          body: |
            Release **Lumina ${{ github.ref_name }}** — APK de production signé et obfusqué.

            **Fichiers :**
            - `Lumina-*.apk` — APK installable
            - `symbols.zip` — symboles de debug (désobfuscation Sentry)
          draft: false
          prerelease: false
          files: |
            ./artifacts/Lumina-*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
